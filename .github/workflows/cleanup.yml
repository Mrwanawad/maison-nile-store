# Cancels online orders left unpaid and returns their stock (every 30 minutes).
# Secrets: SITE_URL (e.g. https://yourbrand.onrender.com), INTERNAL_CRON_TOKEN.
name: Unpaid order cleanup

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 -X POST \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_CRON_TOKEN }}" \
            "${{ secrets.SITE_URL }}/internal/cleanup"
