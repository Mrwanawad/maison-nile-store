{% from "components/icons.html" import icon %}
<div id="cart-drawer"
     class="hs-overlay hs-overlay-open:translate-x-0 hidden translate-x-full rtl:-translate-x-full fixed top-0 end-0 z-[80] h-full w-full max-w-[460px] transform bg-bone shadow-[0_0_80px_-20px_rgb(0_0_0/0.45)] transition-all duration-500 ease-[var(--ease-expo)]"
     role="dialog" tabindex="-1" aria-labelledby="cart-drawer-title">
  <div class="flex h-full flex-col">
    <div class="flex items-center justify-between border-b border-line px-6 py-5">
      <h2 id="cart-drawer-title" class="text-[32px] tracking-[-0.04em]">{{ t("cart.title") }}</h2>
      <button type="button" class="-me-2 flex size-10 items-center justify-center rounded-full ring-1 ring-ink/15 transition-[background-color,color,transform] duration-300 hover:rotate-90 hover:bg-ink hover:text-paper" aria-label="{{ t('common.close') }}" data-hs-overlay="#cart-drawer">
        {{ icon("x", "size-5") }}
      </button>
    </div>
    <div id="cart-drawer-body" class="flex min-h-0 flex-1 flex-col">
      <div class="flex flex-1 items-center justify-center text-ink-soft">{{ icon("loader", "size-6 animate-spin") }}</div>
    </div>
  </div>
</div>
