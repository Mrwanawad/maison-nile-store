{% from "components/icons.html" import icon %}
<div id="cart-drawer"
     class="hs-overlay hs-overlay-open:translate-x-0 hidden translate-x-full rtl:-translate-x-full fixed top-0 end-0 z-[80] h-full w-full max-w-[420px] transform bg-paper shadow-[0_0_40px_rgba(28,27,25,0.18)] transition-all duration-200 ease-out"
     role="dialog" tabindex="-1" aria-labelledby="cart-drawer-title">
  <div class="flex h-full flex-col">
    <div class="flex items-center justify-between border-b border-line px-5 py-4">
      <h2 id="cart-drawer-title" class="text-xl">{{ t("cart.title") }}</h2>
      <button type="button" class="-me-2 p-2 text-ink-soft hover:text-ink" aria-label="{{ t('common.close') }}" data-hs-overlay="#cart-drawer">
        {{ icon("x", "size-5") }}
      </button>
    </div>
    <div id="cart-drawer-body" class="flex min-h-0 flex-1 flex-col">
      <div class="flex flex-1 items-center justify-center text-ink-soft">{{ icon("loader", "size-5 animate-spin") }}</div>
    </div>
  </div>
</div>
