<dl id="checkout-totals" class="mt-4 space-y-2.5 border-t border-separator pt-4 text-[0.9375rem]" aria-live="polite">
  <div class="flex justify-between"><dt class="text-label-2">{{ t("cart.subtotal") }}</dt><dd class="price">{{ price(cart.subtotal) }}</dd></div>
  <div class="flex justify-between">
    <dt class="text-label-2">{{ t("cart.shipping") }}</dt>
    <dd class="price {% if shipping is none %}text-label-2{% endif %}">{{ price(shipping) if shipping is not none else t("checkout.choose_governorate_short") }}</dd>
  </div>
  <div class="flex items-baseline justify-between border-t border-separator pt-3">
    <dt class="text-headline">{{ t("cart.total") }}</dt>
    <dd class="price text-[1.375rem] font-semibold">{{ price(total) }}</dd>
  </div>
</dl>
