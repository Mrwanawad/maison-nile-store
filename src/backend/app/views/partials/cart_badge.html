{% set _count = cart_count(request) %}
<span id="cart-badge"{% if oob is defined and oob %} hx-swap-oob="true"{% endif %}
      class="price absolute end-1 top-1 flex h-[1.125rem] min-w-[1.125rem] items-center justify-center rounded-full bg-tint px-1 text-[0.6875rem] leading-none font-semibold text-on-tint{% if not _count %} hidden{% endif %}">
  <span class="sr-only">{{ t("cart.items_count", count=_count) }}: </span>{{ _count }}
</span>
