{% set _count = cart_count(request) %}
<span id="cart-badge"{% if oob is defined and oob %} hx-swap-oob="true"{% endif %}
      class="absolute -end-1 -top-1 flex min-w-5 items-center justify-center rounded-full bg-accent px-1 text-[10px] font-medium leading-5 text-paper ring-2 ring-bone price{% if not _count %} hidden{% endif %}">
  <span class="sr-only">{{ t("cart.items_count", count=_count) }}: </span>{{ _count }}
</span>
