{% extends "base.html" %}
{% block title %}{{ title }} · {{ brand_name() }}{% endblock %}
{% block content %}
<article>
  <header class="border-b border-line">
    <div class="container-page pt-10 pb-12 md:pt-16 md:pb-20">
      <h1 class="max-w-5xl text-[clamp(3rem,8vw,8rem)]" data-split>{{ title }}</h1>
    </div>
  </header>
  <div class="container-page mt-12 md:mt-16">
    <div class="prose-store mx-auto md:text-base">{{ body }}</div>
  </div>
</article>
{% endblock %}
