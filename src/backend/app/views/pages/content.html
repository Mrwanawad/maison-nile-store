{% extends "base.html" %}
{% block title %}{{ title }} · {{ brand_name() }}{% endblock %}
{% block content %}
<article>
  <header class="border-b-2 border-ink bg-accent text-bone">
    <div class="container-page py-12 md:py-20">
      <h1 class="max-w-4xl text-6xl md:text-8xl" data-reveal>{{ title }}</h1>
    </div>
  </header>
  <div class="container-page mt-12 md:mt-16">
    <div class="prose-store mx-auto md:text-base">{{ body }}</div>
  </div>
</article>
{% endblock %}
