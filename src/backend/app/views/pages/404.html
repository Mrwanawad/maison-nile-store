{% extends "base.html" %}
{% block title %}{{ t("error.404_title") }} · {{ brand_name() }}{% endblock %}
{% block content %}
<div class="container-page grid items-center gap-10 py-16 md:grid-cols-12 md:py-28">
  <div class="relative md:col-span-5" aria-hidden="true">
    <p class="price font-display leading-[0.8] font-light tracking-[-0.07em]" style="font-size: clamp(8rem, 26vw, 20rem)">4<span class="serif text-accent">0</span>4</p>
  </div>
  <div class="md:col-span-6 md:col-start-7">
    <h1 class="text-[clamp(2.5rem,6vw,5rem)]">{{ t("error.404_title") }}</h1>
    <p class="mt-4 text-lg">{{ t("error.404_body") }}</p>
    <div class="mt-8 flex flex-wrap gap-4">
      <a href="{{ url('/shop') }}" class="btn btn-primary btn-lg">{{ t("nav.shop_all") }}</a>
      <a href="{{ url('/') }}" class="btn btn-secondary btn-lg">{{ t("nav.home") }}</a>
    </div>
  </div>
</div>
{% endblock %}
