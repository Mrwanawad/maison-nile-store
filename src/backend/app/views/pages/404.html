{% extends "base.html" %}
{% block title %}{{ t("error.404_title") }} · {{ brand_name() }}{% endblock %}
{% block content %}
<div class="container-page max-w-xl py-24 text-center md:py-36">
  <p class="price text-[1.0625rem] font-semibold text-label-2">404</p>
  <h1 class="text-display mt-2">{{ t("error.404_title") }}</h1>
  <p class="mt-4 text-[1.1875rem] text-label-2">{{ t("error.404_body") }}</p>
  <div class="mt-8 flex flex-wrap justify-center gap-3">
    <a href="{{ url('/shop') }}" class="btn btn-primary btn-lg">{{ t("nav.shop_all") }}</a>
    <a href="{{ url('/') }}" class="btn btn-secondary btn-lg">{{ t("nav.home") }}</a>
  </div>
</div>
{% endblock %}
