{% extends "base.html" %}
{% block title %}{{ t("track.title") }} · {{ brand_name() }}{% endblock %}
{% block content %}
<div class="container-page max-w-xl pt-10 md:pt-16">
  <h1 class="text-[clamp(3rem,8vw,7rem)]" data-split>{{ t("track.title") }}</h1>
  <p class="mt-3 text-ink-soft">{{ t("track.body") }}</p>
  {% if error %}<p class="mt-6 rounded-sm border border-danger/30 bg-danger/5 px-4 py-3 text-danger" role="alert">{{ t(error) }}</p>{% endif %}
  <form method="post" action="{{ url('/track') }}" class="panel mt-8 space-y-5 p-6 md:p-8">
    {{ csrf_input(request) }}
    <div>
      <label for="order_number" class="field-label">{{ t("track.order_number") }}</label>
      <input id="order_number" name="order_number" inputmode="numeric" required placeholder="1001" dir="ltr"
             value="{{ values.get('order_number', '') }}" class="field text-start">
    </div>
    <div>
      <label for="phone" class="field-label">{{ t("checkout.phone") }}</label>
      <input id="phone" name="phone" type="tel" inputmode="tel" required placeholder="01XXXXXXXXX" dir="ltr"
             value="{{ values.get('phone', '') }}" class="field text-start">
    </div>
    <button class="btn btn-primary btn-lg w-full">{{ t("track.submit") }}</button>
  </form>
</div>
{% endblock %}
