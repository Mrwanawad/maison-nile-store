# Local development: Postgres + the app with auto-reload + Tailwind watcher.
#   docker compose up -d db        # database only (run the app with uv on the host)
#   docker compose up              # everything (db, app on :8000, CSS watcher)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://store:store@db:5432/store
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/srv/app
      - ./migrations:/srv/migrations
      - ./scripts:/srv/scripts
      - ./media:/srv/media
    depends_on:
      db:
        condition: service_healthy

  css:
    image: node:22-slim
    working_dir: /srv
    command: sh -c "npm ci && npm run vendor && npm run watch:css"
    volumes:
      - ./:/srv
      - /srv/node_modules

volumes:
  pgdata:
