{% from "components/icons.html" import icon %}
<div id="mobile-nav"
     class="hs-overlay hs-overlay-open:translate-x-0 hidden -translate-x-full rtl:translate-x-full fixed top-0 start-0 z-[80] h-full w-full max-w-[320px] transform bg-bone transition-all duration-200 ease-out lg:hidden"
     role="dialog" tabindex="-1" aria-label="{{ t('nav.menu') }}">
  <div class="flex items-center justify-between border-b border-line px-5 py-4">
    <span class="font-display text-xl">{{ brand_name() }}</span>
    <button type="button" class="-me-2 p-2" aria-label="{{ t('common.close') }}" data-hs-overlay="#mobile-nav">{{ icon("x", "size-5") }}</button>
  </div>
  <nav class="flex flex-col px-5 py-4" aria-label="{{ t('nav.main') }}">
    <a href="{{ url('/shop') }}" class="border-b border-line py-3.5 text-lg">{{ t("nav.shop_all") }}</a>
    {% for c in nav_categories() %}
    <a href="{{ url('/c/' ~ c.slug) }}" class="border-b border-line py-3.5 text-lg">{{ c.name(locale()) }}</a>
    {% endfor %}
    <a href="{{ url('/shop?sort=newest') }}" class="border-b border-line py-3.5 text-lg">{{ t("nav.new") }}</a>
    <a href="{{ url('/track') }}" class="border-b border-line py-3.5 text-lg">{{ t("nav.track") }}</a>
    <a href="{{ url('/pages/about') }}" class="border-b border-line py-3.5 text-lg">{{ t("nav.about") }}</a>
  </nav>
  <div class="px-5">
    <a href="{{ switch_locale_url(request) }}" class="inline-flex items-center gap-2 py-2 text-ink-soft" lang="{{ 'en' if locale() == 'ar' else 'ar' }}">
      {{ icon("globe", "size-4") }} {{ "English" if locale() == "ar" else "العربية" }}
    </a>
  </div>
</div>
