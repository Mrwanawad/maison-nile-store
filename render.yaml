# Render Blueprint: one free web service on Render's native Python runtime
# (Docker services require a card on file, even on the free instance).
# Secrets are set in the Render dashboard (sync: false) and never committed.
services:
  - type: web
    name: brand-store
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./deploy/render-build.sh
    startCommand: ./deploy/render-start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: STORAGE_BACKEND
        value: supabase
      - key: DATABASE_USE_POOLER
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: INTERNAL_CRON_TOKEN
        generateValue: true
      # BASE_URL defaults to Render's RENDER_EXTERNAL_URL; set it only for a custom domain.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ADMIN_BOOTSTRAP_USERNAME
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
